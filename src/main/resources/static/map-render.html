<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pozit Map Render</title>

    <style>
        :root {
            --panel-bg: rgba(255, 255, 255, 0.94);
            --panel-border: rgba(28, 35, 54, 0.14);
            --text: #1b2537;
            --muted: #667085;
            --purple3: #9FA1FF;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            color: var(--text);
            font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .toolbar {
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 10;
            display: flex;
            max-width: calc(100vw - 32px);
            align-items: center;
            gap: 8px;
            padding: 10px;
            overflow-x: auto;
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            background: var(--panel-bg);
            box-shadow: 0 10px 30px rgba(18, 26, 38, 0.14);
            backdrop-filter: blur(12px);
        }

        .day-button {
            min-width: 58px;
            height: 34px;
            padding: 0 12px;
            border: 1px solid rgba(28, 35, 54, 0.12);
            border-radius: 8px;
            background: #ffffff;
            color: var(--text);
            font: inherit;
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
            cursor: pointer;
        }

        .day-button[aria-pressed="true"] {
            border-color: var(--day-color);
            background: var(--day-color);
            color: #ffffff;
        }

        .status {
            position: fixed;
            right: 16px;
            bottom: 16px;
            z-index: 10;
            max-width: min(420px, calc(100vw - 32px));
            padding: 12px 14px;
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            background: var(--panel-bg);
            color: var(--muted);
            box-shadow: 0 10px 30px rgba(18, 26, 38, 0.12);
            font-size: 13px;
            line-height: 1.45;
            backdrop-filter: blur(12px);
        }

        .spot-marker {
            position: relative;
            display: grid;
            width: 40px;
            height: 40px;
            place-items: center;
            padding: 0;
            border: 1.5px solid transparent;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 0 4px rgba(159, 161, 255, 0.4);
            cursor: pointer;
            user-select: none;
        }

        .spot-marker.is-selected {
            border-color: var(--purple3);
        }

        .spot-marker.is-visiting {
            border-color: var(--purple3);
        }

        .spot-marker.is-visited {
            background: var(--purple3);
        }

        .spot-marker.is-visited::after {
            width: 13px;
            height: 7px;
            border-bottom: 3px solid #ffffff;
            border-left: 3px solid #ffffff;
            content: "";
            transform: translateY(-1px) rotate(-45deg);
        }

        .spot-marker img {
            display: block;
            width: 30px;
            height: 30px;
            object-fit: contain;
            pointer-events: none;
        }

        .spot-marker.is-visited img {
            display: none;
        }

        .spot-marker.is-not-visited {
            border: 1px solid var(--purple3);
            background: #ffffff;
        }

        .spot-marker.is-not-visited img {
            display: none;
        }

        @media (max-width: 640px) {
            .toolbar {
                top: 10px;
                left: 10px;
                max-width: calc(100vw - 20px);
                padding: 8px;
            }

            .status {
                right: 10px;
                bottom: 10px;
                max-width: calc(100vw - 20px);
            }
        }

        body.is-capture .toolbar,
        body.is-capture .status {
            display: none;
        }
    </style>
</head>

<body>
<div id="map"></div>
<div id="toolbar" class="toolbar" hidden></div>
<div id="status" class="status">manifest를 불러오는 중입니다.</div>

<script>
    const DAY_COLORS = [
        "#2563eb",
        "#dc2626",
        "#059669",
        "#d97706",
        "#7c3aed",
        "#0891b2",
        "#be123c",
        "#4d7c0f"
    ];

    const DEFAULT_CENTER = {
        latitude: 37.579617,
        longitude: 126.977041
    };

    const params = new URLSearchParams(window.location.search);
    const toolbar = document.getElementById("toolbar");
    const statusBox = document.getElementById("status");
    const overlays = [];
    const polylines = [];
    const captureMode = params.get("capture") === "true";
    const fitPadding = captureMode ? 28 : 44;
    let map;
    let activeDay = "all";
    let normalizedCourses = [];

    if (captureMode) {
        document.body.classList.add("is-capture");
    }

    loadKakaoMapsSdk()
        .then(() => kakao.maps.load(async function () {
        map = new kakao.maps.Map(
            document.getElementById("map"),
            {
                center: new kakao.maps.LatLng(DEFAULT_CENTER.latitude, DEFAULT_CENTER.longitude),
                level: 4
            }
        );

        try {
            const manifest = await loadManifest();
            normalizedCourses = normalizeCourses(manifest);
            applyRouteIndexes(normalizedCourses);
            const currentRouteIndex = getCurrentRouteIndex(normalizedCourses);
            renderDayControls(normalizedCourses);
            renderRoutes(normalizedCourses);
            renderMarkers(normalizedCourses, currentRouteIndex);
            applyDayFilter("all");
            updateStatus(normalizedCourses);
            console.log("Kakao Map render complete", manifest);
        } catch (error) {
            console.error(error);
            statusBox.textContent = error.message;
        }
    }))
        .catch((error) => {
            console.error(error);
            statusBox.textContent = error.message;
        });

    async function loadKakaoMapsSdk() {
        const config = await fetchJson("/api/map-render/config");
        const kakaoJavaScriptKey = config.kakaoJavaScriptKey;
        if (!kakaoJavaScriptKey) {
            throw new Error("Kakao Map JavaScript key가 설정되지 않았습니다.");
        }

        return new Promise((resolve, reject) => {
            const script = document.createElement("script");
            script.type = "text/javascript";
            script.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${encodeURIComponent(kakaoJavaScriptKey)}&autoload=false`;
            script.onload = resolve;
            script.onerror = () => reject(new Error("Kakao Map SDK 로드에 실패했습니다."));
            document.head.appendChild(script);
        });
    }

    async function loadManifest() {
        const inlineManifest = window.TIMELAPSE_MANIFEST;
        if (inlineManifest) {
            return inlineManifest;
        }

        const manifestUrl = params.get("manifestUrl");
        if (manifestUrl) {
            return fetchJson(manifestUrl);
        }

        const jobId = params.get("jobId");
        if (jobId) {
            return fetchJson(`/api/pozing/edit-jobs/${encodeURIComponent(jobId)}/map-manifest`);
        }

        throw new Error("jobId 또는 manifestUrl 쿼리 파라미터가 필요합니다.");
    }

    async function fetchJson(url) {
        const response = await fetch(url, {
            headers: {
                "Accept": "application/json"
            }
        });

        if (!response.ok) {
            throw new Error(`manifest 요청 실패: ${response.status}`);
        }

        const body = await response.json();
        return body.result ?? body;
    }

    function normalizeCourses(manifest) {
        const courses = Array.isArray(manifest?.courses) ? manifest.courses : [];

        return courses
            .map((course) => ({
                courseId: course.courseId,
                dayNumber: Number(course.dayNumber),
                color: dayColor(Number(course.dayNumber)),
                spots: normalizeSpots(course)
            }))
            .filter((course) => Number.isFinite(course.dayNumber) && course.spots.length > 0)
            .sort((a, b) => a.dayNumber - b.dayNumber);
    }

    function applyRouteIndexes(courses) {
        let routeIndex = 0;
        for (const course of courses) {
            for (const spot of course.spots) {
                spot.routeIndex = routeIndex++;
            }
        }
    }

    function normalizeSpots(course) {
        const spots = Array.isArray(course?.spots) ? course.spots : [];

        return spots
            .map((spot) => ({
                courseSpotId: spot.courseSpotId,
                name: spot.name || "이름 없음",
                orderIndex: Number(spot.orderIndex),
                latitude: Number(spot.latitude),
                longitude: Number(spot.longitude)
            }))
            .filter((spot) => Number.isFinite(spot.latitude) && Number.isFinite(spot.longitude))
            .sort((a, b) => a.orderIndex - b.orderIndex);
    }

    function renderDayControls(courses) {
        toolbar.replaceChildren();
        if (courses.length === 0) {
            toolbar.hidden = true;
            return;
        }

        toolbar.hidden = false;
        toolbar.appendChild(createDayButton("all", "전체", "#111827"));

        for (const course of courses) {
            toolbar.appendChild(createDayButton(course.dayNumber, `Day ${course.dayNumber}`, course.color));
        }
    }

    function createDayButton(day, label, color) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "day-button";
        button.textContent = label;
        button.style.setProperty("--day-color", color);
        button.setAttribute("aria-pressed", String(day === activeDay));
        button.addEventListener("click", () => applyDayFilter(day));
        return button;
    }

    function renderMarkers(courses, currentRouteIndex) {
        clearMarkers();

        for (const course of courses) {
            for (const spot of course.spots) {
                const position = new kakao.maps.LatLng(spot.latitude, spot.longitude);
                const markerElement = createMarkerElement(course, spot, currentRouteIndex);
                const overlay = new kakao.maps.CustomOverlay({
                    position,
                    content: markerElement,
                    xAnchor: 0.5,
                    yAnchor: 0.5
                });

                overlay.dayNumber = course.dayNumber;
                overlay.position = position;
                overlay.routeIndex = spot.routeIndex;
                overlay.setZIndex(10);
                overlay.setMap(map);
                overlays.push(overlay);
            }
        }
    }

    function renderRoutes(courses) {
        clearRoutes();

        for (const course of courses) {
            if (course.spots.length < 2) {
                continue;
            }

            const path = course.spots.map((spot) => new kakao.maps.LatLng(
                spot.latitude,
                spot.longitude
            ));

            const polyline = new kakao.maps.Polyline({
                path,
                strokeWeight: 3.36,
                strokeColor: "#9FA1FF",
                strokeOpacity: 0.85,
                strokeStyle: "solid",
                zIndex: 1
            });

            polyline.dayNumber = course.dayNumber;
            polyline.setMap(map);
            polylines.push(polyline);
        }
    }

    function createMarkerElement(course, spot, currentRouteIndex) {
        const marker = document.createElement("div");
        marker.className = "spot-marker";
        marker.title = `Day ${course.dayNumber} ${spot.orderIndex}. ${spot.name}`;
        marker.dataset.status = getMarkerStatus(spot.routeIndex, currentRouteIndex);
        marker.classList.add(getMarkerStatusClass(marker.dataset.status));
        if (marker.dataset.status === "VISITING") {
            marker.classList.add("is-selected");
        }

        const image = document.createElement("img");
        image.src = "/just_posong.png";
        image.alt = "";
        marker.appendChild(image);

        marker.addEventListener("click", () => {
            for (const selectedMarker of document.querySelectorAll(".spot-marker.is-selected")) {
                selectedMarker.classList.remove("is-selected");
            }
            marker.classList.add("is-selected");
        });

        return marker;
    }

    function getMarkerStatus(routeIndex, currentRouteIndex) {
        if (!Number.isFinite(currentRouteIndex)) {
            return "NOT_VISITED";
        }

        if (routeIndex < currentRouteIndex) {
            return "VISITED";
        }
        if (routeIndex === currentRouteIndex) {
            return "VISITING";
        }
        return "NOT_VISITED";
    }

    function getMarkerStatusClass(status) {
        if (status === "NOT_VISITED") {
            return "is-not-visited";
        }
        return `is-${status.toLowerCase()}`;
    }

    function getCurrentRouteIndex(courses) {
        const routeIndexParam = params.get("currentRouteIndex");
        const routeIndex = Number(routeIndexParam);
        if (routeIndexParam !== null && Number.isFinite(routeIndex)) {
            return routeIndex;
        }

        const currentCourseSpotId = params.get("currentCourseSpotId");
        if (!currentCourseSpotId) {
            return null;
        }

        for (const course of courses) {
            for (const spot of course.spots) {
                if (String(spot.courseSpotId) === currentCourseSpotId) {
                    return spot.routeIndex;
                }
            }
        }

        return null;
    }

    function applyDayFilter(day) {
        activeDay = day;
        const visiblePositions = [];

        for (const overlay of overlays) {
            const isVisible = day === "all" || overlay.dayNumber === day;
            overlay.setMap(isVisible ? map : null);
            if (isVisible) {
                visiblePositions.push(overlay.position);
            }
        }

        for (const polyline of polylines) {
            const isVisible = day === "all" || polyline.dayNumber === day;
            polyline.setMap(isVisible ? map : null);
        }

        for (const button of toolbar.querySelectorAll(".day-button")) {
            const isPressed = button.textContent === "전체"
                ? day === "all"
                : button.textContent === `Day ${day}`;
            button.setAttribute("aria-pressed", String(isPressed));
        }

        fitMap(visiblePositions);
    }

    function fitMap(positions) {
        if (positions.length === 0) {
            return;
        }

        if (positions.length === 1) {
            map.setCenter(positions[0]);
            map.setLevel(captureMode ? 3 : 4);
            return;
        }

        const bounds = new kakao.maps.LatLngBounds();
        for (const position of positions) {
            bounds.extend(position);
        }
        map.setBounds(bounds, fitPadding, fitPadding, fitPadding, fitPadding);
    }

    function updateStatus(courses) {
        const spotCount = courses.reduce((total, course) => total + course.spots.length, 0);
        const routeCount = courses.reduce((total, course) => total + Math.max(course.spots.length - 1, 0), 0);
        if (spotCount === 0) {
            statusBox.textContent = "표시할 courseSpot 좌표가 없습니다.";
            return;
        }

        statusBox.textContent = `${courses.length}개 day, ${spotCount}개 courseSpot, ${routeCount}개 경로 선을 표시했습니다.`;
    }

    function clearMarkers() {
        for (const overlay of overlays) {
            overlay.setMap(null);
        }
        overlays.length = 0;
    }

    function clearRoutes() {
        for (const polyline of polylines) {
            polyline.setMap(null);
        }
        polylines.length = 0;
    }

    function dayColor(dayNumber) {
        const index = Math.abs(dayNumber - 1) % DAY_COLORS.length;
        return DAY_COLORS[index];
    }
</script>

</body>
</html>
