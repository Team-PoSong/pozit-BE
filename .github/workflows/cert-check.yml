name: Certificate Check

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  certificate-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Check certificate expiry
        id: cert
        run: |
          END=$(echo | timeout 30 openssl s_client -connect api.pozit.kr:443 -servername api.pozit.kr 2>/dev/null | openssl x509 -noout -enddate 2>/dev/null | cut -d= -f2)
          if [ -z "$END" ]; then
            echo "alert=true" >> "$GITHUB_OUTPUT"
            echo "message=인증서 정보를 가져오지 못했습니다" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          DAYS=$(( ($(date -d "$END" +%s) - $(date +%s)) / 86400 ))
          EXPIRES=$(TZ=Asia/Seoul date -d "$END" '+%Y-%m-%d %H:%M KST')
          echo "만료일: $EXPIRES (${DAYS}일 남음)"
          if [ "$DAYS" -lt 14 ]; then
            echo "alert=true" >> "$GITHUB_OUTPUT"
            echo "message=${DAYS}일 후 만료 (${EXPIRES})" >> "$GITHUB_OUTPUT"
          else
            echo "alert=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify Discord
        if: steps.cert.outputs.alert == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MESSAGE: ${{ steps.cert.outputs.message }}
        run: |
          PAYLOAD=$(jq -n --arg msg "$MESSAGE" '{username: "pozit health", content: ("**[POZIT] SSL 인증서 확인 필요**\n`api.pozit.kr` " + $msg)}')
          curl -fsS -X POST -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"
          exit 1
