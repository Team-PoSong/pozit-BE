name: Health Check

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Check /api/health
        id: check
        run: |
          for i in 1 2 3; do
            if curl -fsS --max-time 10 https://api.pozit.kr/api/health > /dev/null; then
              echo "healthy=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "healthy=false" >> "$GITHUB_OUTPUT"

      - name: Notify Discord
        if: steps.check.outputs.healthy == 'false'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          NOW=$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S')
          PAYLOAD=$(jq -n --arg now "$NOW" '{username: "pozit health", content: ("**[POZIT] Server Down**\n`GET https://api.pozit.kr/api/health` 3회 연속 실패\n시각: " + $now + " KST")}')
          curl -fsS -X POST -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"
          exit 1
